<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="Letters rain into the well - drag across touching tiles to spell words before it fills.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#06060E">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spellfall">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root {
    color-scheme: dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body { height: 100%; }
  body { margin: 0; background: #06060E; font: 14px system-ui, sans-serif; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }

  /* add-to-home-screen prompt */
  #install {
    position: fixed; z-index: 9;
    left: 12px; right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    border-radius: 16px;
    background: #141428;
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 14px 40px rgba(0,0,0,0.55);
    font-family: "Chakra Petch", system-ui, sans-serif;
    color: #F2F0FF;
    animation: rise 320ms cubic-bezier(.22,.9,.3,1);
  }
  @keyframes rise { from { transform: translateY(120%); } to { transform: none; } }
  #install .txt { flex: 1 1 auto; min-width: 0; font-size: 12px; line-height: 1.45; }
  #install .txt b { display: block; font-size: 13px; letter-spacing: 0.04em; }
  #install .txt span { color: #8A87B8; }
  #install button {
    flex: 0 0 auto;
    font-family: inherit; font-size: 11px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    border: 0; border-radius: 999px; cursor: pointer;
  }
  #install .go {
    padding: 10px 18px; color: #0A0714;
    background: linear-gradient(92deg, #45E6C4, #8B6CFF);
  }
  #install .no {
    padding: 10px 12px; color: #8A87B8; background: transparent;
  }
  @media (prefers-reduced-motion: reduce) { #install { animation: none; } }
</style>
</head>
<body>
<title>Spellfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Unbounded:wght@500;700;800&display=swap">
<style>
  :root {
    --ground: #06060E;
    --glass: rgba(255, 255, 255, 0.045);
    --glass-line: rgba(255, 255, 255, 0.10);
    --well: #0C0C18;
    --ink: #F2F0FF;
    --muted: #8A87B8;
    --hot: #FF4FA3;
    --volt: #8B6CFF;
    --mint: #45E6C4;
    --warn: #FFA76B;
    --font-num: "Unbounded", "Trebuchet MS", system-ui, sans-serif;
    --font-ui: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-ui);
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    touch-action: manipulation;
    position: relative;
  }
  body::before {
    content: "";
    position: fixed;
    inset: -20%;
    background:
      radial-gradient(38% 30% at 20% 12%, rgba(69, 230, 196, 0.16), transparent 70%),
      radial-gradient(42% 34% at 84% 80%, rgba(139, 108, 255, 0.24), transparent 72%),
      radial-gradient(32% 26% at 62% 44%, rgba(255, 79, 163, 0.14), transparent 70%);
    filter: blur(20px);
    pointer-events: none;
    z-index: 0;
    animation: drift 26s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translate3d(-2%, -1%, 0) scale(1); }
    to   { transform: translate3d(3%, 2%, 0) scale(1.08); }
  }

  #app {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 8px 16px 0;
    box-sizing: border-box;
    max-width: 520px;
    margin: 0 auto;
  }

  .label {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- header ---------- */
  .top { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; }
  .score-wrap { flex: 1 1 auto; min-width: 0; }
  #score {
    font-family: var(--font-num);
    font-weight: 800;
    font-size: clamp(26px, 9vw, 36px);
    line-height: 1.1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(96deg, var(--ink) 20%, var(--mint) 66%, var(--volt) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    transition: transform 90ms ease-out;
  }
  #score.bump { transform: scale(1.07); }

  .mini { display: flex; gap: 6px; flex: 0 0 auto; }
  .pill {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    padding: 6px 10px;
    border-radius: 12px;
    background: var(--glass);
    border: 1px solid var(--glass-line);
    backdrop-filter: blur(8px);
    min-width: 46px;
  }
  .pill b {
    font-family: var(--font-num);
    font-weight: 700;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  .pill.level b { color: var(--mint); }
  .pill.best b { color: var(--volt); }
  .pill.flare { animation: flare 700ms ease-out; }
  @keyframes flare {
    0%   { box-shadow: 0 0 0 0 rgba(69, 230, 196, 0.55); border-color: var(--mint); }
    100% { box-shadow: 0 0 0 16px rgba(69, 230, 196, 0); border-color: var(--glass-line); }
  }

  /* ---------- word bar ---------- */
  .bar {
    flex: 0 0 auto;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 0 14px;
    border-radius: 14px;
    background: var(--glass);
    border: 1px solid var(--glass-line);
    backdrop-filter: blur(8px);
    transition: border-color 140ms, background 140ms;
  }
  .bar.ok { border-color: rgba(69, 230, 196, 0.65); background: rgba(69, 230, 196, 0.10); }
  .bar.dup { border-color: rgba(255, 167, 107, 0.65); background: rgba(255, 167, 107, 0.10); }
  .bar.bad { border-color: rgba(255, 79, 163, 0.55); background: rgba(255, 79, 163, 0.09); }
  .bar.shake { animation: nudge 320ms ease; }
  @keyframes nudge {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    45% { transform: translateX(6px); }
    70% { transform: translateX(-3px); }
  }
  #word {
    font-family: var(--font-num);
    font-weight: 800;
    font-size: 19px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #word.empty {
    font-family: var(--font-ui);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--muted);
  }
  #gain {
    font-family: var(--font-num);
    font-weight: 800;
    font-size: 17px;
    font-variant-numeric: tabular-nums;
    color: var(--mint);
    flex: 0 0 auto;
  }
  #gain.dup { color: var(--warn); }
  #gain.bad { color: var(--hot); }
  #streak {
    flex: 0 0 auto;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: #0E1018;
    background: linear-gradient(92deg, var(--warn), var(--hot));
  }

  /* ---------- power-ups ---------- */
  .powers { flex: 0 0 auto; display: flex; gap: 7px; }
  .pw {
    flex: 1 1 0; min-width: 0; height: 44px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-family: var(--font-ui); font-size: 10px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink);
    background: var(--glass); border: 1px solid var(--glass-line);
    border-radius: 13px; backdrop-filter: blur(8px);
    cursor: pointer; touch-action: none;
    transition: transform 70ms ease-out, opacity 150ms, box-shadow 180ms, border-color 180ms, background 180ms;
  }
  .pw:active { transform: scale(0.95); }
  .pw svg {
    width: 17px; height: 17px; flex: 0 0 auto;
    fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round;
  }
  .pw i {
    font-style: normal; font-family: var(--font-num); font-weight: 700; font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .pw.blast { color: #FF87B0; }
  .pw.freeze { color: #7FD7FF; }
  .pw.reveal { color: var(--mint); }
  .pw.out { opacity: 0.28; cursor: default; }
  .pw.armed {
    border-color: currentColor;
    background: rgba(255, 135, 176, 0.14);
    box-shadow: 0 0 22px rgba(255, 135, 176, 0.45);
  }
  .pw.gained { animation: gained 700ms ease-out; }
  @keyframes gained {
    0%   { box-shadow: 0 0 0 0 rgba(255,255,255,0.5); border-color: currentColor; }
    100% { box-shadow: 0 0 0 16px rgba(255,255,255,0); border-color: var(--glass-line); }
  }
  .frost {
    position: absolute; top: 9px; left: 50%; transform: translateX(-50%); z-index: 2;
    padding: 5px 13px; border-radius: 999px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
    color: #06131C; background: linear-gradient(92deg, #7FD7FF, #C7EEFF);
    box-shadow: 0 0 24px rgba(127, 215, 255, 0.55);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- board ---------- */
  .stage {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  #board {
    display: block;
    max-width: 100%;
    border-radius: 14px;
    touch-action: none;
    background: var(--well);
    border: 1px solid var(--glass-line);
    box-shadow: 0 0 44px rgba(139, 108, 255, 0.18), inset 0 1px 0 rgba(255,255,255,0.05);
  }

  .veil {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 18px;
    box-sizing: border-box;
    text-align: center;
    background: rgba(6, 6, 14, 0.90);
    backdrop-filter: blur(6px);
    border-radius: 14px;
  }
  .veil .kicker {
    font-size: 10px; font-weight: 700; letter-spacing: 0.26em;
    text-transform: uppercase; color: var(--muted);
  }
  .veil .final {
    font-family: var(--font-num);
    font-weight: 800;
    font-size: clamp(34px, 13vw, 50px);
    line-height: 1;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(96deg, var(--mint), var(--volt));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .badge {
    padding: 4px 12px; border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: #14101F; background: linear-gradient(92deg, var(--mint), #9BFFDF);
  }
  .veil .recap { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; line-height: 1.7; }
  .veil .recap b { color: var(--ink); font-weight: 700; }
  .veil .links { display: flex; gap: 8px; margin-top: 12px; }
  .play {
    padding: 13px 26px;
    font-family: var(--font-ui);
    font-size: 13px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
    color: #0A0714;
    background: linear-gradient(92deg, var(--mint), var(--volt));
    border: 0; border-radius: 999px;
    box-shadow: 0 6px 30px rgba(69, 230, 196, 0.28);
    cursor: pointer;
  }
  .play.ghost {
    color: var(--ink);
    background: var(--glass);
    border: 1px solid var(--glass-line);
    box-shadow: none;
  }
  .play:active { transform: translateY(1px); }

  /* ---------- controls ---------- */
  .pad {
    flex: 0 0 auto;
    display: flex;
    gap: 7px;
    padding-top: 7px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  }
  .key {
    min-width: 0;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-family: var(--font-ui);
    font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink);
    background: var(--glass);
    border: 1px solid var(--glass-line);
    border-radius: 16px;
    backdrop-filter: blur(8px);
    cursor: pointer;
    touch-action: none;
    transition: transform 70ms ease-out, background 120ms, opacity 120ms;
  }
  .key:active { transform: scale(0.95); }
  .key.wide { flex: 1 1 0; }
  .key.tabkey { flex: 0 0 auto; padding: 0 14px; }
  .key.tabkey b {
    font-family: var(--font-num); font-weight: 700; font-size: 14px;
    color: var(--mint); font-variant-numeric: tabular-nums;
  }
  .key.accent {
    color: #0A0714;
    background: linear-gradient(150deg, var(--mint), var(--volt));
    border-color: transparent;
    box-shadow: 0 4px 22px rgba(69, 230, 196, 0.26);
  }
  .key.accent[disabled] {
    opacity: 0.32;
    box-shadow: none;
    cursor: default;
  }
  .key:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }

  .hint {
    flex: 0 0 auto;
    font-size: 10px; color: var(--muted); text-align: center;
    letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 2px;
  }

  /* ---------- words sheet ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 4;
    background: rgba(4, 4, 10, 0.6);
    backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none;
    transition: opacity 200ms ease;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 5;
    max-height: 74%;
    display: flex;
    flex-direction: column;
    padding: 10px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    box-sizing: border-box;
    background: #10101E;
    border-top: 1px solid var(--glass-line);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -18px 60px rgba(0, 0, 0, 0.6);
    transform: translateY(103%);
    transition: transform 260ms cubic-bezier(.22,.9,.3,1);
  }
  .sheet.open { transform: none; }
  .grip {
    width: 42px; height: 4px; border-radius: 999px;
    background: rgba(255,255,255,0.18);
    margin: 0 auto 10px;
    flex: 0 0 auto;
  }
  .sheet-head {
    flex: 0 0 auto;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 10px;
    padding-bottom: 10px;
  }
  .sheet-head .tally {
    font-family: var(--font-num); font-weight: 700; font-size: 16px;
    font-variant-numeric: tabular-nums;
  }
  .sheet-head .tally span { color: var(--mint); }
  .sheet-close {
    padding: 8px 16px;
    font-family: var(--font-ui); font-size: 11px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink); background: var(--glass);
    border: 1px solid var(--glass-line); border-radius: 999px; cursor: pointer;
  }
  .sheet-list {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column; gap: 4px;
    padding-right: 2px;
  }
  .row {
    display: flex; align-items: baseline; gap: 10px;
    padding: 9px 12px;
    border-radius: 10px;
    background: rgba(255,255,255,0.035);
  }
  .row .w {
    flex: 1 1 auto; min-width: 0;
    font-family: var(--font-num); font-weight: 700; font-size: 14px;
    letter-spacing: 0.08em; text-transform: uppercase;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row .n { flex: 0 0 auto; font-size: 10px; color: var(--muted); letter-spacing: 0.1em; }
  .row .p {
    flex: 0 0 auto;
    font-family: var(--font-num); font-weight: 700; font-size: 14px;
    font-variant-numeric: tabular-nums; color: var(--mint);
  }
  .row.top { background: linear-gradient(92deg, rgba(139,108,255,0.22), rgba(69,230,196,0.10)); }
  .empty-note {
    padding: 22px 8px; text-align: center; font-size: 12px; color: var(--muted); line-height: 1.7;
  }

  @media (prefers-reduced-motion: reduce) {
    body::before { animation: none; }
    .pill.flare, .bar.shake, .pw.gained { animation: none; }
    #score, .key, .sheet, .scrim { transition: none; }
  }
</style>

<div id="app">
  <div class="top">
    <div class="score-wrap">
      <div class="label">Score</div>
      <div id="score">0</div>
    </div>
    <div class="mini">
      <div class="pill level"><span class="label">Pace</span><b id="level">1</b></div>
      <div class="pill best"><span class="label">Best</span><b id="best">0</b></div>
    </div>
  </div>

  <div class="bar" id="bar">
    <div id="word" class="empty">Tap or drag letters that touch</div>
    <div id="gain" hidden>+0</div>
    <div id="streak" hidden>×2</div>
  </div>

  <div class="powers">
    <button class="pw blast" id="pw-blast" aria-label="Blast power-up">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="14" r="6.5"/><path d="M16 9l3-3"/><path d="M18 4l1 2 2 1-2 1-1 2-1-2-2-1 2-1z"/></svg>
      Blast <i id="n-blast">0</i>
    </button>
    <button class="pw freeze" id="pw-freeze" aria-label="Freeze power-up">
      <svg viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/></svg>
      Freeze <i id="n-freeze">0</i>
    </button>
    <button class="pw reveal" id="pw-reveal" aria-label="Reveal power-up">
      <svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.6"/></svg>
      Reveal <i id="n-reveal">0</i>
    </button>
  </div>

  <div class="stage">
    <canvas id="board"></canvas>
    <div class="frost" id="frost" hidden>Frozen 12s</div>
    <div class="veil" id="veil" hidden>
      <div class="kicker">Final score</div>
      <div class="final" id="veil-score">0</div>
      <div class="badge" id="veil-badge" hidden>New best</div>
      <div class="recap" id="veil-recap"></div>
      <div class="links">
        <button class="play ghost" id="veil-words">Word list</button>
        <button class="play" id="play">Play again</button>
      </div>
    </div>
  </div>

  <div class="pad">
    <button class="key tabkey" id="k-tab" aria-label="Open word list">Words <b id="tab-n">0</b></button>
    <button class="key wide" id="k-clear">Clear</button>
    <button class="key wide accent" id="k-submit" disabled>Submit</button>
  </div>

  <div class="hint">Tap letters one by one, or drag &middot; each word counts once</div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grip"></div>
  <div class="sheet-head">
    <div>
      <div class="label">Words you made</div>
      <div class="tally"><span id="sheet-n">0</span> words · <span id="sheet-pts">0</span> pts</div>
    </div>
    <button class="sheet-close" id="sheet-close">Close</button>
  </div>
  <div class="sheet-list" id="sheet-list"></div>

<script>
(function () {
  "use strict";

  var COLS = 6, ROWS = 7, MINW = 3;

  var VALUE = {
    a:1,b:3,c:3,d:2,e:1,f:4,g:2,h:4,i:1,j:8,k:5,l:1,m:3,
    n:1,o:1,p:3,r:1,s:1,t:1,u:1,v:4,w:4,x:8,y:4,z:10,q:10

  var BAG_SPEC = "a9 b2 c3 d4 e13 f2 g3 h3 i9 j1 k1 l5 m3 n7 o8 p3 r7 s7 t7 u4 v1 w2 x1 y2 z1";
  var POOL = [];
  BAG_SPEC.split(" ").forEach(function (t) {
    for (var i = 0, n = parseInt(t.slice(1), 10); i < n; i++) POOL.push(t[0]);
  });

  var TINT = {
    1:  ["#7FB0FF", "#3F63C8"],
    2:  ["#5BE7C9", "#21A98C"],
    3:  ["#B98BFF", "#7B45DE"],
    4:  ["#FF87B0", "#DB3E72"],
    5:  ["#FFA76B", "#E2662A"],
    8:  ["#FFD36B", "#E09A1E"],
    10: ["#FFE873", "#D9A800"]
  };
  var LEN_MULT = { 3: 1, 4: 2, 5: 3, 6: 5, 7: 8 };

  var boardEl = document.getElementById("board");
  var ctx = boardEl.getContext("2d");
  var barEl = document.getElementById("bar");
  var wordEl = document.getElementById("word");
  var gainEl = document.getElementById("gain");
  var streakEl = document.getElementById("streak");
  var submitBtn = document.getElementById("k-submit");
  var tabN = document.getElementById("tab-n");
  var sheet = document.getElementById("sheet");
  var scrim = document.getElementById("scrim");
  var sheetList = document.getElementById("sheet-list");
  var veil = document.getElementById("veil");
  var levelPill = document.querySelector(".pill.level");

  var grid, sel = [], found = [], foundSet, dragging = false, everDragged = false;
  var score, shown, streak, level, best = 0;
  var cell = 30, rainTimer = 0, last = 0;
  var pops = [], bits = [], shake = 0, over, paused, sheetOpen = false;
  var danger = 0;
  var powers, armed = null, frozen = 0, revealT = 0, frostFade = 0;
  var PREFIX = null, FREEZE_MS = 12000, CAP = 5;

  try { best = parseInt(localStorage.getItem("spellfall-best"), 10) || 0; } catch (e) { best = 0; }
  function saveBest() { try { localStorage.setItem("spellfall-best", String(best)); } catch (e) {} }
  function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
  function val(ch) { return VALUE[ch] || 1; }
  function tint(ch) { return TINT[val(ch)] || TINT[1]; }
  function pick() { return POOL[Math.floor(Math.random() * POOL.length)]; }

  /* ---------- scoring ---------- */
  function mult() { return Math.min(3, 1 + 0.25 * Math.max(0, streak - 1)); }
  function wordPoints(w) {
    var base = 0;
    for (var i = 0; i < w.length; i++) base += val(w[i]);
    return base * (LEN_MULT[w.length] || 8) * 10;
  }
  function previewPoints(w) { return Math.round(wordPoints(w) * mult()); }
  function selWord() {
    return sel.map(function (s) { return grid[s.r][s.c].ch; }).join("");
  }

  /* ---------- board ---------- */
  function landRow(c) {
    for (var r = ROWS - 1; r >= 0; r--) if (!grid[r][c]) return r;
    return -1;
  }
  function colHeight(c) {
    for (var r = 0; r < ROWS; r++) if (grid[r][c]) return ROWS - r;
    return 0;
  }
  function rain() {
    var heights = [], lowest = ROWS + 1, c;
    for (c = 0; c < COLS; c++) {
      heights.push(colHeight(c));
      if (heights[c] < lowest) lowest = heights[c];
    }
    var cands = [];
    for (c = 0; c < COLS; c++) if (heights[c] < ROWS && heights[c] <= lowest + 1) cands.push(c);
    if (!cands.length) {
      for (c = 0; c < COLS; c++) if (heights[c] < ROWS) cands.push(c);
    }
    if (!cands.length) { gameOver(); return; }
    var col = cands[Math.floor(Math.random() * cands.length)];
    var r = landRow(col);
    grid[r][col] = { ch: pick(), y: -1.4 - Math.random() * 0.6 };
  }

  function gravity() {
    for (var c = 0; c < COLS; c++) {
      var stack = [];
      for (var r = ROWS - 1; r >= 0; r--) if (grid[r][c]) stack.push(grid[r][c]);
      for (r = ROWS - 1; r >= 0; r--) grid[r][c] = stack[ROWS - 1 - r] || 0;
    }
  }

  /* ---------- selection ---------- */
  var CORE = 0.42; // how close to a tile's centre a drag must pass to pick it up

  function cellAt(clientX, clientY, precise) {
    var box = boardEl.getBoundingClientRect();
    var fx = (clientX - box.left) / (box.width / COLS);
    var fy = (clientY - box.top) / (box.height / ROWS);
    var c = Math.floor(fx), r = Math.floor(fy);
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return null;
    if (!grid[r][c]) return null;
    if (precise) {
      // corners are dead: a diagonal drag clips the tiles it passes without taking them
      var dx = fx - c - 0.5, dy = fy - r - 0.5;
      if (dx * dx + dy * dy > CORE * CORE) return null;
    }
    return { r: r, c: c };
  }
  function indexOfSel(r, c) {
    for (var i = 0; i < sel.length; i++) if (sel[i].r === r && sel[i].c === c) return i;
    return -1;
  }
  function touches(a, b) {
    return Math.abs(a.r - b.r) <= 1 && Math.abs(a.c - b.c) <= 1;
  }
  function addCell(t) {
    if (!t) return false;
    var at = indexOfSel(t.r, t.c);
    if (at >= 0) {
      // stepping back onto the previous tile undoes the last pick
      if (at === sel.length - 2) { sel.pop(); refreshBar(); return true; }
      return false;
    }
    if (sel.length && !touches(sel[sel.length - 1], t)) return false;
    sel.push(t);
    buzz(6);
    refreshBar();
    return true;
  }
  function clearSel() { sel = []; refreshBar(); }

  function status() {
    var w = selWord();
    if (w.length < MINW) return "short";
    if (foundSet.has(w)) return "dup";
    if (!WORDS.has(w)) return "bad";
    return "ok";
  }

  function refreshBar() {
    if (armed === "blast") {
      barEl.classList.remove("ok", "dup", "bad");
      wordEl.className = "empty";
      wordEl.textContent = "Tap a letter — clears a 3×3 block";
      gainEl.hidden = true;
      streakEl.hidden = true;
      submitBtn.disabled = true;
      return;
    }
    var w = selWord(), s = status();
    barEl.classList.remove("ok", "dup", "bad");
    gainEl.classList.remove("dup", "bad");
    if (!w) {
      wordEl.className = "empty";
      wordEl.textContent = "Tap or drag letters that touch";
      gainEl.hidden = true;
      submitBtn.disabled = true;
    } else {
      wordEl.className = "";
      wordEl.textContent = w;
      gainEl.hidden = false;
      if (s === "ok") {
        barEl.classList.add("ok");
        gainEl.textContent = "+" + previewPoints(w);
        submitBtn.disabled = false;
      } else if (s === "dup") {
        barEl.classList.add("dup");
        gainEl.classList.add("dup");
        gainEl.textContent = "used";
        submitBtn.disabled = true;
      } else if (s === "bad") {
        barEl.classList.add("bad");
        gainEl.classList.add("bad");
        gainEl.textContent = "?";
        submitBtn.disabled = true;
      } else {
        gainEl.textContent = w.length + "/" + MINW;
        submitBtn.disabled = true;
      }
    }
    if (streak > 1) {
      streakEl.hidden = false;
      streakEl.textContent = "×" + mult().toFixed(2).replace(/0$/, "").replace(/\.$/, "");
    } else { streakEl.hidden = true; }
  }

  function reject() {
    barEl.classList.remove("shake");
    void barEl.offsetWidth;
    barEl.classList.add("shake");
    buzz([12, 50, 12]);
    streak = 0;
    clearSel();
  }

  function submit() {

    var w = selWord();
    if (status() !== "ok") { if (w.length >= MINW) reject(); return; }

    var pts = previewPoints(w);
    score += pts;
    foundSet.add(w);

    });

    pop(w.toUpperCase(), cx, cy, cell * 0.52, accent);
    pop("+" + pts, cx, cy + cell * 0.66, cell * 0.72, accent);
    if (streak > 1) pop("STREAK ×" + mult().toFixed(2).replace(/0$/, "").replace(/\.$/, ""), cx, cy + cell * 1.3, cell * 0.36, "#FFA76B");

    shake = Math.max(shake, 3 + Math.min(6, pts / 40));
    buzz(w.length >= 5 ? [16, 40, 20] : 14);

    sel = [];
    gravity();
    refreshBar();
    renderList();

    if (w.length >= 5) grant();
    if (found.length % 4 === 0) grant();

    var nextLevel = Math.floor(found.length / 6) + 1;
    if (nextLevel > level) {
      level = nextLevel;
      pop("PACE " + level, COLS * cell / 2, ROWS * cell * 0.3, cell * 0.56, "#45E6C4");
      levelPill.classList.remove("flare");
      void levelPill.offsetWidth;
      levelPill.classList.add("flare");
    }
    if (score > best) { best = score; saveBest(); }
  }

  /* ---------- effects ---------- */
  function pop(text, x, y, size, color) {
    pops.push({ text: text, x: x, y: y, t: 0, life: 1050, size: size, color: color });
  }
  function spark(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = 0.05 + Math.random() * 0.2;
      bits.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.08,
        t: 0, life: 460 + Math.random() * 360,
        size: cell * (0.08 + Math.random() * 0.14), color: color
      });
    }
  }

  /* ---------- power-ups ---------- */
  var KINDS = ["blast", "freeze", "reveal"];
  var PW_COLOR = { blast: "#FF87B0", freeze: "#7FD7FF", reveal: "#45E6C4" };

  function renderPowers() {
    KINDS.forEach(function (k) {
      document.getElementById("n-" + k).textContent = powers[k];
      var btn = document.getElementById("pw-" + k);
      btn.classList.toggle("out", powers[k] <= 0 || over);
      btn.classList.toggle("armed", armed === k);
    });
  }

  function grant() {
    var open = KINDS.filter(function (k) { return powers[k] < CAP; });
    if (!open.length) return;
    var k = open[Math.floor(Math.random() * open.length)];
    powers[k] += 1;
    renderPowers();
    var btn = document.getElementById("pw-" + k);
    btn.classList.remove("gained");
    void btn.offsetWidth;
    btn.classList.add("gained");
    pop("+1 " + k.toUpperCase(), COLS * cell / 2, ROWS * cell * 0.15, cell * 0.38, PW_COLOR[k]);
  }

  function blast(r0, c0) {
    var hit = 0, r, c;
    for (r = r0 - 1; r <= r0 + 1; r++) {
      for (c = c0 - 1; c <= c0 + 1; c++) {
        if (r < 0 || r >= ROWS || c < 0 || c >= COLS || !grid[r][c]) continue;
        spark((c + 0.5) * cell, (r + 0.5) * cell, tint(grid[r][c].ch)[0], 8);
        grid[r][c] = 0;
        hit++;
      }
    }
    armed = null;
    if (!hit) { renderPowers(); refreshBar(); return; }
    powers.blast -= 1;
    sel = [];
    gravity();
    shake = 9;
    buzz([18, 40, 22]);
    pop(hit + " GONE", (c0 + 0.5) * cell, (r0 + 0.5) * cell, cell * 0.46, "#FF87B0");
    renderPowers();
    refreshBar();
  }

  function buildPrefix() {
    PREFIX = new Set();
    WORDS.forEach(function (w) {
      for (var i = 1; i <= 4 && i <= w.length; i++) PREFIX.add(w.slice(0, i));
    });
  }

  // walk every adjacency chain on the board for the best word not already used
  function findPath() {
    if (!PREFIX) buildPrefix();
    var bestPath = null, bestPts = -1, nodes = 0;
    var path = [], seen = {};
    function walk(r, c, word) {
      if (nodes > 90000) return;
      if (bestPath && bestPath.length >= 5) return;
      nodes++;
      word += grid[r][c].ch;
      path.push({ r: r, c: c });
      seen[r * COLS + c] = 1;
      if (word.length >= MINW && WORDS.has(word) && !foundSet.has(word)) {
        var pts = previewPoints(word);
        if (pts > bestPts) { bestPts = pts; bestPath = path.slice(); }
      }
      if (word.length < 6 && (word.length > 4 || PREFIX.has(word))) {
        for (var dr = -1; dr <= 1; dr++) {
          for (var dc = -1; dc <= 1; dc++) {
            if (!dr && !dc) continue;
            var nr = r + dr, nc = c + dc;
            if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
            if (!grid[nr][nc] || seen[nr * COLS + nc]) continue;
            walk(nr, nc, word);
          }
        }
      }
      path.pop();
      seen[r * COLS + c] = 0;
    }
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) if (grid[r][c]) walk(r, c, "");
    }
    return bestPath;
  }

  function usePower(k) {
    if (over || !powers[k]) return;
    if (k === "blast") {
      armed = armed === "blast" ? null : "blast";
      buzz(8);
      renderPowers();
      refreshBar();
      return;
    }
    if (k === "freeze") {
      powers.freeze -= 1;
      frozen += FREEZE_MS;
      armed = null;
      buzz([10, 30, 10]);
      pop("FROZEN", COLS * cell / 2, ROWS * cell * 0.32, cell * 0.58, "#7FD7FF");
      renderPowers();
      refreshBar();
      return;
    }
    if (k === "reveal") {
      var path = findPath();
      if (!path) {
        pop("NOTHING LEFT", COLS * cell / 2, ROWS * cell * 0.32, cell * 0.4, "#FFA76B");
        buzz([12, 50, 12]);
        return;
      }
      powers.reveal -= 1;
      armed = null;
      sel = path;
      revealT = 760;
      buzz(12);
      renderPowers();
      refreshBar();
      // show the word lit up on the board, then play it
      var promised = selWord();
      setTimeout(function () {
        if (!over && selWord() === promised) submit();
      }, 720);
      return;
    }
  }

  /* ---------- word list ---------- */
  function renderList() {
    tabN.textContent = found.length;
    document.getElementById("sheet-n").textContent = found.length;
    var total = found.reduce(function (a, f) { return a + f.pts; }, 0);
    document.getElementById("sheet-pts").textContent = total.toLocaleString();
    if (!found.length) {
      sheetList.innerHTML = '<div class="empty-note">No words yet.<br>Tap letters that touch, one by one — or drag across them.<br>Sideways, up, down or diagonally all count.</div>';
      return;
    }
    var topPts = 0;
    found.forEach(function (f) { if (f.pts > topPts) topPts = f.pts; });
    var html = "";
    for (var i = found.length - 1; i >= 0; i--) {
      var f = found[i];
      html += '<div class="row' + (f.pts === topPts ? ' top' : '') + '">' +
        '<div class="w">' + f.word + '</div>' +
        '<div class="n">' + f.len + ' letters</div>' +
        '<div class="p">+' + f.pts.toLocaleString() + '</div></div>';
    }
    sheetList.innerHTML = html;
  }
  function openSheet() {
    sheetOpen = true;
    renderList();
    sheet.classList.add("open");
    scrim.classList.add("open");
  }
  function closeSheet() {
    sheetOpen = false;
    sheet.classList.remove("open");
    scrim.classList.remove("open");
    last = 0;
  }

  /* ---------- lifecycle ---------- */
  function gameOver() {
    over = true;
    armed = null;
    frozen = 0;
    renderPowers();
    var isBest = score >= best && score > 0;
    if (score > best) { best = score; saveBest(); }
    var longest = "", top = null;
    found.forEach(function (f) {
      if (f.len > longest.length) longest = f.word;
      if (!top || f.pts > top.pts) top = f;
    });
    document.getElementById("veil-score").textContent = score.toLocaleString();
    document.getElementById("veil-badge").hidden = !isBest;
    document.getElementById("veil-recap").innerHTML =
      "<b>" + found.length + "</b> " + (found.length === 1 ? "word" : "words") + " made<br>" +
      (longest ? "longest <b>" + longest.toUpperCase() + "</b> · " : "") +
      "best <b>" + (top ? top.word.toUpperCase() + " +" + top.pts : "—") + "</b>";
    veil.hidden = false;
    buzz([30, 60, 30]);
  }

  function reset() {
    grid = [];
    for (var r = 0; r < ROWS; r++) grid.push(new Array(COLS).fill(0));
    sel = []; found = []; foundSet = new Set();
    pops = []; bits = []; shake = 0; danger = 0;
    score = 0; shown = 0; streak = 0; level = 1;
    over = false; paused = false; rainTimer = 0;
    powers = { blast: 1, freeze: 1, reveal: 1 };
    armed = null; frozen = 0; revealT = 0; frostFade = 0;
    closeSheet();
    veil.hidden = true;
    // open with a playable board instead of an empty well
    for (var i = 0; i < COLS * 3; i++) rain();
    for (r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) if (grid[r][c]) grid[r][c].y = r;
    refreshBar();
    renderList();
    renderPowers();
  }

  function rainEvery() { return Math.max(850, 2600 - (level - 1) * 130); }

  /* ---------- rendering ---------- */
  function fitCanvas() {
    var stage = boardEl.parentNode;
    var availH = stage.clientHeight - 4, availW = stage.clientWidth - 4;
    if (availH <= 0 || availW <= 0) return;
    cell = Math.max(12, Math.floor(Math.min(availW / COLS, availH / ROWS)));
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    boardEl.style.width = (cell * COLS) + "px";
    boardEl.style.height = (cell * ROWS) + "px";
    boardEl.width = Math.round(cell * COLS * dpr);
    boardEl.height = Math.round(cell * ROWS * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function tile(g, x, y, size, ch, opts) {
    opts = opts || {};
    var pair = tint(ch);
    var pad = Math.max(1, size * 0.06);
    var s = size - pad * 2;
    var rad = Math.max(3, size * 0.22);
    g.globalAlpha = opts.alpha == null ? 1 : opts.alpha;

    g.beginPath();
    if (g.roundRect) g.roundRect(x + pad, y + pad, s, s, rad);
    else g.rect(x + pad, y + pad, s, s);
    var grad = g.createLinearGradient(x, y, x + size, y + size);
    grad.addColorStop(0, opts.picked ? "#FFFFFF" : pair[0]);
    grad.addColorStop(1, opts.picked ? pair[0] : pair[1]);
    g.fillStyle = grad;
    g.shadowColor = pair[0];
    g.shadowBlur = size * (opts.picked ? 0.7 : 0.26);
    g.fill();
    g.shadowBlur = 0;

    g.beginPath();
    if (g.roundRect) g.roundRect(x + pad + s * 0.12, y + pad + s * 0.1, s * 0.76, s * 0.22, rad * 0.5);
    else g.rect(x + pad + s * 0.12, y + pad + s * 0.1, s * 0.76, s * 0.22);
    g.fillStyle = "rgba(255,255,255,0.24)";
    g.fill();

    g.fillStyle = "rgba(10,7,20,0.92)";
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.font = "800 " + (size * 0.5).toFixed(1) + "px Unbounded, system-ui, sans-serif";
    g.fillText(ch.toUpperCase(), x + size / 2, y + size / 2 + size * 0.03);

    g.font = "700 " + (size * 0.17).toFixed(1) + "px Chakra Petch, system-ui, sans-serif";
    g.textAlign = "right";
    g.fillStyle = "rgba(10,7,20,0.62)";
    g.fillText(String(val(ch)), x + size - pad - size * 0.09, y + size - pad - size * 0.12);
    g.globalAlpha = 1;
  }

  function paint(dt) {
    if (!grid) return;
    var w = cell * COLS, h = cell * ROWS, i, r, c, t;

    ctx.save();
    if (shake > 0.3) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      shake *= 0.86;
    } else { shake = 0; }

    ctx.clearRect(-14, -14, w + 28, h + 28);
    ctx.fillStyle = "#0C0C18";
    ctx.fillRect(-14, -14, w + 28, h + 28);

    ctx.strokeStyle = "rgba(255,255,255,0.04)";
    ctx.lineWidth = 1;
    for (i = 1; i < COLS; i++) { ctx.beginPath(); ctx.moveTo(i * cell + 0.5, 0); ctx.lineTo(i * cell + 0.5, h); ctx.stroke(); }
    for (i = 1; i < ROWS; i++) { ctx.beginPath(); ctx.moveTo(0, i * cell + 0.5); ctx.lineTo(w, i * cell + 0.5); ctx.stroke(); }

    // the well warns before it drowns you
    var top = 0;
    for (c = 0; c < COLS; c++) top = Math.max(top, colHeight(c));
    var want = top >= ROWS - 1 ? 1 : top >= ROWS - 2 ? 0.55 : 0;
    danger += (want - danger) * Math.min(1, dt * 0.004);
    if (danger > 0.01) {
      var dg = ctx.createLinearGradient(0, 0, 0, cell * 2.4);
      dg.addColorStop(0, "rgba(255,79,163," + (0.32 * danger).toFixed(3) + ")");
      dg.addColorStop(1, "rgba(255,79,163,0)");
      ctx.fillStyle = dg;
      ctx.fillRect(0, 0, w, cell * 2.4);
    }

    frostFade += ((frozen > 0 ? 1 : 0) - frostFade) * Math.min(1, dt * 0.006);
    if (frostFade > 0.01) {
      ctx.fillStyle = "rgba(127,215,255," + (0.07 * frostFade).toFixed(3) + ")";
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = "rgba(127,215,255," + (0.55 * frostFade).toFixed(3) + ")";
      ctx.lineWidth = 2;
      ctx.strokeRect(1, 1, w - 2, h - 2);
    }

    var picked = {};
    sel.forEach(function (s) { picked[s.r * COLS + s.c] = true; });

    for (r = 0; r < ROWS; r++) {
      for (c = 0; c < COLS; c++) {
        t = grid[r][c];
        if (!t) continue;
        if (Math.abs(t.y - r) > 0.01) {
          t.y += (r - t.y) * Math.min(1, dt * 0.016);
          if (Math.abs(t.y - r) < 0.02) t.y = r;
        }
        var on = picked[r * COLS + c];
        var sc = on ? 1.08 : 1;
        var off = (cell * sc - cell) / 2;
        tile(ctx, c * cell - off, t.y * cell - off, cell * sc, t.ch, { picked: on });
      }
    }

    if (revealT > 0) {
      revealT = Math.max(0, revealT - dt);
      var pulse = 0.5 + 0.5 * Math.sin(revealT * 0.012);
      ctx.strokeStyle = "rgba(69,230,196," + (0.35 + 0.5 * pulse).toFixed(3) + ")";
      ctx.lineWidth = Math.max(2, cell * 0.07);
      ctx.shadowColor = "#45E6C4";
      ctx.shadowBlur = 16;
      sel.forEach(function (s) {
        var t2 = grid[s.r][s.c];
        if (!t2) return;
        var rr = cell * (0.5 + 0.08 * pulse);
        ctx.beginPath();
        ctx.arc((s.c + 0.5) * cell, (t2.y + 0.5) * cell, rr, 0, Math.PI * 2);
        ctx.stroke();
      });
      ctx.shadowBlur = 0;
    }

    // thread linking the picked letters
    if (sel.length > 1) {
      ctx.beginPath();
      for (i = 0; i < sel.length; i++) {
        var px = (sel[i].c + 0.5) * cell, py = (grid[sel[i].r][sel[i].c].y + 0.5) * cell;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.strokeStyle = "rgba(255,255,255,0.85)";
      ctx.lineWidth = Math.max(2, cell * 0.09);
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.shadowColor = "#45E6C4";
      ctx.shadowBlur = 14;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    for (i = bits.length - 1; i >= 0; i--) {
      var b = bits[i];
      b.t += dt;
      if (b.t >= b.life) { bits.splice(i, 1); continue; }
      b.x += b.vx * dt; b.y += b.vy * dt; b.vy += 0.00045 * dt;
      ctx.globalAlpha = Math.max(0, 1 - b.t / b.life);
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x, b.y, b.size, b.size);
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (i = pops.length - 1; i >= 0; i--) {
      var p = pops[i];
      p.t += dt;
      if (p.t >= p.life) { pops.splice(i, 1); continue; }
      var pf = p.t / p.life;
      var rise = Math.min(1, pf * 2.4);
      var grow = pf < 0.14 ? 0.7 + (pf / 0.14) * 0.4 : 1.1 - (pf - 0.14) * 0.12;
      ctx.globalAlpha = pf > 0.6 ? (1 - pf) / 0.4 : 1;
      ctx.font = "800 " + (p.size * grow).toFixed(1) + "px Unbounded, system-ui, sans-serif";
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 18;
      ctx.fillText(p.text, Math.max(cell * 1.5, Math.min(w - cell * 1.5, p.x)), p.y - rise * cell * 1.3);
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  var lastText = "", bumpUntil = 0;
  function syncHud(now) {
    var diff = score - shown;
    if (Math.abs(diff) > 0.5) {
      shown += diff * 0.2;
      if (Math.abs(score - shown) < 1) shown = score;
      bumpUntil = now + 110;
    } else { shown = score; }
    var txt = Math.round(shown).toLocaleString();
    if (txt !== lastText) { document.getElementById("score").textContent = txt; lastText = txt; }
    document.getElementById("score").classList.toggle("bump", now < bumpUntil);
    var fr = document.getElementById("frost");
    if (frozen > 0) {
      fr.hidden = false;
      fr.textContent = "Frozen " + Math.ceil(frozen / 1000) + "s";
    } else if (!fr.hidden) { fr.hidden = true; }
    document.getElementById("level").textContent = level;
    document.getElementById("best").textContent = Math.max(best, score).toLocaleString();
  }

  function loop(t) {
    var dt = Math.min(64, t - (last || t));
    last = t;
    if (!over && !paused && !sheetOpen) {
      if (frozen > 0) frozen = Math.max(0, frozen - dt);
      else {
        rainTimer += dt;
        if (rainTimer >= rainEvery()) { rainTimer = 0; rain(); }
      }
    }
    paint(dt);
    syncHud(t);
    requestAnimationFrame(loop);
  }

  /* ---------- input ---------- */
  boardEl.addEventListener("pointerdown", function (e) {
    if (over) return;
    e.preventDefault();
    if (armed === "blast") {
      var bx = boardEl.getBoundingClientRect();
      var bc = Math.floor((e.clientX - bx.left) / (bx.width / COLS));
      var br = Math.floor((e.clientY - bx.top) / (bx.height / ROWS));
      if (br >= 0 && br < ROWS && bc >= 0 && bc < COLS) blast(br, bc);
      return;
    }
    var t = cellAt(e.clientX, e.clientY);
    if (!t) { clearSel(); return; }
    var at = indexOfSel(t.r, t.c);
    if (at >= 0) {
      // tapping a picked tile trims the word back to it
      sel = sel.slice(0, at);
      refreshBar();
      dragging = true; everDragged = false;
      return;
    }
    if (sel.length && !touches(sel[sel.length - 1], t)) sel = [];
    addCell(t);
    dragging = true;
    everDragged = false;
    try { boardEl.setPointerCapture(e.pointerId); } catch (err) {}
  });
  boardEl.addEventListener("pointermove", function (e) {
    if (!dragging || over) return;
    e.preventDefault();
    var t = cellAt(e.clientX, e.clientY, true);
    if (!t) return;
    if (indexOfSel(t.r, t.c) === sel.length - 1) return;

    var last = sel[sel.length - 1];
    if (last && !touches(last, t)) {
      // moved fast and jumped one tile: if it sat exactly between them in a
      // straight or diagonal line, the finger crossed it, so take it too
      var dr = t.r - last.r, dc = t.c - last.c;
      var straight = (dr === 0 || dc === 0 || Math.abs(dr) === Math.abs(dc));
      if (straight && Math.max(Math.abs(dr), Math.abs(dc)) === 2) {
        var mid = { r: last.r + dr / 2, c: last.c + dc / 2 };
        if (grid[mid.r][mid.c] && indexOfSel(mid.r, mid.c) < 0) addCell(mid);
      }
    }
    if (addCell(t)) everDragged = true;
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    try { boardEl.releasePointerCapture(e.pointerId); } catch (err) {}
    // a drag commits on release; taps stay open so you can build one letter at a time
    if (everDragged && sel.length >= MINW) submit();
    else if (everDragged) clearSel();
  }
  boardEl.addEventListener("pointerup", endDrag);
  boardEl.addEventListener("pointercancel", function (e) { dragging = false; });

  KINDS.forEach(function (k) {
    document.getElementById("pw-" + k).addEventListener("click", function () { usePower(k); });
  });
  document.getElementById("k-submit").addEventListener("click", submit);
  document.getElementById("k-clear").addEventListener("click", function () { clearSel(); });
  document.getElementById("k-tab").addEventListener("click", openSheet);
  document.getElementById("veil-words").addEventListener("click", openSheet);
  document.getElementById("sheet-close").addEventListener("click", closeSheet);
  scrim.addEventListener("click", closeSheet);
  document.getElementById("play").addEventListener("click", function () { reset(); });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { if (over) reset(); else submit(); }
    else if (e.key === "Escape") {
      if (sheetOpen) closeSheet();
      else if (armed) { armed = null; renderPowers(); refreshBar(); }
      else clearSel();
    }
    else if (e.key === "1") usePower("blast");
    else if (e.key === "2") usePower("freeze");
    else if (e.key === "3") usePower("reveal");
    else if (e.key === "w" || e.key === "W") { sheetOpen ? closeSheet() : openSheet(); }
  });

  document.addEventListener("visibilitychange", function () { paused = document.hidden; last = 0; });
  window.addEventListener("resize", fitCanvas);
  if (window.ResizeObserver) new ResizeObserver(fitCanvas).observe(boardEl.parentNode);

  function start(state) {
    fitCanvas();
    reset();
    if (state && typeof state.score === "number" && state.found) {
      score = state.score; shown = score;
      found = state.found;
      found.forEach(function (f) { foundSet.add(f.word); });
      level = Math.floor(found.length / 6) + 1;
      renderList();
    }
    requestAnimationFrame(loop);
  }
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    window.claude.hot.snapshot(function () { return { score: score, found: found }; });
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) {
    window.claude.hot.ready(start);
  } else {
    start((window.claude && window.claude.hot && window.claude.hot.data) || {});
  }
})();
</script>

<div id="install" hidden>
  <div class="txt">
    <b id="install-title">Install Spellfall</b>
    <span id="install-note">Play offline, straight from your home screen.</span>
  </div>
  <button class="no" id="install-no" aria-label="Dismiss">Not now</button>
  <button class="go" id="install-go">Install</button>
</div>

<script>
(function () {
  "use strict";

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }

  var bar = document.getElementById("install");
  var go = document.getElementById("install-go");
  var deferred = null;

  function dismissed() {
    try { return localStorage.getItem("spellfall-install-dismissed") === "1"; }
    catch (e) { return false; }
  }
  function remember() {
    try { localStorage.setItem("spellfall-install-dismissed", "1"); } catch (e) {}
  }
  function installed() {
    return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  }

  document.getElementById("install-no").addEventListener("click", function () {
    bar.hidden = true;
    remember();
  });

  // Android / desktop Chrome: the browser hands us a real install prompt
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferred = e;
    if (!dismissed() && !installed()) bar.hidden = false;
  });

  go.addEventListener("click", function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; bar.hidden = true; });
  });

  window.addEventListener("appinstalled", function () {
    bar.hidden = true;
    remember();
  });

  // iOS Safari has no prompt event - tell people where the button is
  var iOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
            (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (iOS && !installed() && !dismissed()) {
    document.getElementById("install-title").textContent = "Add to Home Screen";
    document.getElementById("install-note").textContent = "Tap Share, then Add to Home Screen.";
    go.hidden = true;
    setTimeout(function () { if (!dismissed()) bar.hidden = false; }, 2500);
  }
})();
</script>
</body>
</html>
